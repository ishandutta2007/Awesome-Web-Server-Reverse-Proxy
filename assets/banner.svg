<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 36px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .metric-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .metric-val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #38bdf8;
    }
  </style>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Decorative Grid Pattern in Background -->
  <g opacity="0.08">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#38bdf8" stroke-width="1" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Dynamic Glowing Data Flow Curves (Background animation) -->
  <g opacity="0.35">
    <!-- Stream 1: Cluster to Storage -->
    <path d="M -50,280 Q 250,200 520,240 T 950,170 T 1250,110" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="10s" repeatCount="indefinite" />
    </path>
    <!-- Stream 2: CSI Snapshot Replication -->
    <path d="M -50,90 Q 300,30 650,80 T 1150,30 T 1300,70" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="0" to="200" dur="14s" repeatCount="indefinite" />
    </path>
    <!-- Stream 3: Disaster Recovery Sync -->
    <path d="M -50,330 Q 350,300 750,320 T 1250,280" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="10 14" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="300" to="0" dur="18s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Ambient Pulsing Glow Orbs in Background -->
  <circle cx="180" cy="80" r="110" fill="#38bdf8" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="90;130;90" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.16;0.08" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="270" r="130" fill="#818cf8" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="110;150;110" dur="9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== FOREGROUND CONTENT ==================== -->

  <!-- Top Category Tag -->
  <g transform="translate(60, 42)">
    <rect width="320" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="14" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" class="badge-text">CLOUD-NATIVE DATA PROTECTION &amp; DR</text>
  </g>

  <!-- Main Hero Title -->
  <text x="60" y="115" class="title-text">
    Awesome Kubernetes Cluster &amp;
  </text>
  <text x="60" y="160" class="title-text" fill="url(#accentGrad)">
    Persistent Volume Backup 🛡️ ☸️
  </text>

  <!-- Subtitle / Tagline -->
  <text x="60" y="202" class="subtitle-text">
    Curated Enterprise SaaS Platforms, CSI Snapshots &amp; Open-Source Operators for K8s Recovery
  </text>

  <!-- Dynamic / Metric Pills in Foreground -->
  <g transform="translate(60, 242)">
    <!-- Pill 1: Etcd & Resources -->
    <g transform="translate(0, 0)">
      <rect width="186" height="66" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="66" rx="2" fill="#38bdf8" />
      <text x="16" y="24" class="metric-label">Cluster State &amp; Etcd</text>
      <text x="16" y="48" class="metric-val">CRDs, Secrets &amp; Configs</text>
    </g>

    <!-- Pill 2: CSI Snapshots -->
    <g transform="translate(202, 0)">
      <rect width="186" height="66" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="66" rx="2" fill="#818cf8" />
      <text x="16" y="24" class="metric-label">Persistent Volumes</text>
      <text x="16" y="48" class="metric-val" fill="#818cf8">CSI VolumeSnapshots</text>
    </g>

    <!-- Pill 3: App Consistency -->
    <g transform="translate(404, 0)">
      <rect width="186" height="66" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="66" rx="2" fill="#34d399" />
      <text x="16" y="24" class="metric-label">Application-Aware</text>
      <text x="16" y="48" class="metric-val" fill="#34d399">Quiesce Hooks &amp; Blueprints</text>
    </g>

    <!-- Pill 4: Multi-Cluster DR -->
    <g transform="translate(606, 0)">
      <rect width="186" height="66" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="66" rx="2" fill="#c084fc" />
      <text x="16" y="24" class="metric-label">Disaster Recovery</text>
      <text x="16" y="48" class="metric-val" fill="#c084fc">Cross-Cluster Migration</text>
    </g>
  </g>

  <!-- Right Hero Graphic: Kubernetes Backup Flow Architecture -->
  <g transform="translate(930, 46)">
    <!-- Node 1: Kubernetes Cluster State -->
    <g transform="translate(0, 0)">
      <rect width="200" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
      <circle cx="20" cy="26" r="6" fill="#38bdf8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12" fill="#ffffff">K8s CLUSTER / ETCD</text>
      <text x="36" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Namespaces &amp; Metadata</text>
    </g>

    <!-- Flow Arrow 1 -->
    <g transform="translate(100, 54)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3">
        <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.5s" repeatCount="indefinite" />
      </line>
      <polygon points="-4,20 4,20 0,26" fill="#38bdf8" />
    </g>

    <!-- Node 2: Persistent Volume Claims (PVC) -->
    <g transform="translate(0, 84)">
      <rect width="200" height="52" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" opacity="0.95" />
      <circle cx="20" cy="26" r="6" fill="#818cf8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12" fill="#ffffff">CSI PV SNAPSHOTS</text>
      <text x="36" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Volume Backup &amp; Restic</text>
    </g>

    <!-- Flow Arrow 2 -->
    <g transform="translate(100, 138)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 3">
        <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.5s" repeatCount="indefinite" />
      </line>
      <polygon points="-4,20 4,20 0,26" fill="#818cf8" />
    </g>

    <!-- Node 3: Immutable Target Vault / Object Storage -->
    <g transform="translate(0, 168)">
      <rect width="200" height="58" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.8" opacity="0.95" />
      <circle cx="20" cy="29" r="6" fill="#34d399">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12" fill="#34d399">IMMUTABLE REPOSITORY 🔒</text>
      <text x="36" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="10" fill="#cbd5e1">S3 / Air-Gapped Object Store</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#334155" stroke-width="1" />
</svg>
